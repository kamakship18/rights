# Render Blueprint — Actionable Justice OS
# Deploy with: render blueprint apply
# See: https://render.com/docs/blueprint-spec

services:
  # ── NestJS API ─────────────────────────────────────
  - type: web
    name: justice-os-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @repo/prisma generate && pnpm --filter @repo/shared run build && pnpm --filter @repo/api run build
    startCommand: node apps/api/dist/main.js
    postDeployCommand: pnpm --filter @repo/prisma migrate:deploy
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: justice-os-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_SMS
        sync: false
      - key: TWILIO_FROM_WHATSAPP
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  # ── NestJS Worker ──────────────────────────────────
  - type: worker
    name: justice-os-worker
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @repo/prisma generate && pnpm --filter @repo/shared run build && pnpm --filter @repo/worker run build
    startCommand: node apps/worker/dist/main.js
    postDeployCommand: pnpm --filter @repo/prisma migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: DATABASE_URL
        fromDatabase:
          name: justice-os-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: CRON_SCHEDULE
        sync: false
      - key: CRON_TZ
        value: "Asia/Kolkata"

  # ── FastAPI AI Service ─────────────────────────────
  - type: web
    name: justice-os-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    rootDir: apps/ai
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: "legal-statutes"
      - key: KANOON_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: justice-os-db
          property: connectionString

databases:
  - name: justice-os-db
    plan: free
    databaseName: justice_os
    postgresMajorVersion: "16"
